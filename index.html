<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reviewer Response Starter</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --text:#172033; --muted:#6b7280;
    --line:#dbe1ea; --accent:#3157d5; --accent2:#2445ae; --ok:#0f766e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 56px}
  h1{margin:0 0 8px;font-size:30px}
  .sub{color:var(--muted);margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 6px 24px rgba(23,32,51,.05);margin-bottom:18px}
  label{display:block;font-weight:700;margin-bottom:8px}
  textarea,input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font:inherit;color:var(--text);background:#fff;outline:none}
  textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(49,87,213,.10)}
  #comments{min-height:230px;resize:vertical}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}
  .primary{background:var(--accent);color:white}.primary:hover{background:var(--accent2)}
  .secondary{background:#eef2ff;color:#273b91}.ghost{background:#f3f4f6;color:#374151}
  .result{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
  .rhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  .rtitle{font-weight:800}.comment{background:#f8fafc;border-left:4px solid #c7d2fe;padding:10px 12px;border-radius:8px;color:#334155;margin-bottom:10px;white-space:pre-wrap}
  .starter{min-height:92px;resize:vertical}.mini{font-size:13px;color:var(--muted)}
  .pill{display:inline-block;font-size:12px;background:#ecfeff;color:var(--ok);padding:4px 8px;border-radius:999px;font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:20px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:20px 12px}h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Reviewer Response Starter</h1>
  <div class="sub">Hakem yorumlarını yapıştırın; her yorum için akademik, içeriğe özgü point-by-point response başlangıçları oluşturulsun.</div>
  <div class="card">
    <div class="grid">
      <div><label for="reviewer">Reviewer etiketi</label><input id="reviewer" value="R1"></div>
      <div><label for="tone">Yanıt tonu</label><select id="tone"><option value="balanced">Balanced / Academic</option><option value="warm">Warm / Appreciative</option><option value="concise">Concise / Direct</option></select></div>
    </div>
    <div style="margin-top:14px">
      <label for="comments">Hakem yorumları</label>
      <textarea id="comments" placeholder="Örnek:\n\nR1.1\nThe theoretical contribution is not sufficiently clear.\n\nR1.2\nThe literature review should be updated to include recent studies...\n\nR1.3\nThe methodology section should provide additional information about the sampling procedure..."></textarea>
      <div class="mini" style="margin-top:7px">R1.1, R1.2 gibi numaralar varsa korunur. Yoksa yorumlar boş satırlara göre ayrılır.</div>
    </div>
    <div class="actions"><button class="primary" onclick="generate()">Response Başlangıçlarını Oluştur</button><button class="secondary" onclick="loadExample()">Örnek Yükle</button><button class="ghost" onclick="clearAll()">Temizle</button></div>
  </div>
  <div class="card">
    <div class="rhead"><div><div style="font-size:19px;font-weight:800">Çıktı</div><div class="mini">Metinler düzenlenebilir.</div></div><div class="actions" style="margin:0"><button class="secondary" onclick="copyAll()">Tümünü Kopyala</button><button class="ghost" onclick="downloadTxt()">TXT İndir</button></div></div>
    <div id="results" class="empty">Henüz bir çıktı oluşturulmadı.</div>
  </div>
</div>
<script>
const templates={
 theoretical:{balanced:["We appreciate the reviewer’s important observation regarding the need to clarify the theoretical contribution of the study. In response to this comment, the relevant sections of the manuscript have been revised to more explicitly articulate how the proposed framework extends the existing literature.","We thank the reviewer for highlighting the need for a clearer articulation of the study’s theoretical contribution. Accordingly, the manuscript has been revised to better explain the theoretical value added by the proposed model beyond its application in the present context."],warm:["We sincerely appreciate the reviewer’s insightful observation concerning the theoretical contribution of the study. This comment has helped us sharpen the positioning of the manuscript, and the relevant sections have been revised to more clearly demonstrate how the proposed model extends prior research."],concise:["We thank the reviewer for this important comment. The theoretical contribution has been clarified by explaining more explicitly how the proposed model extends prior research."]},
 literature:{balanced:["We thank the reviewer for this helpful suggestion regarding the currency and scope of the literature review. Accordingly, the relevant section has been updated and expanded to incorporate more recent and directly relevant studies.","We appreciate the reviewer’s recommendation to strengthen the literature review. In response, recent research has been incorporated and the discussion of the focal literature streams has been broadened."],warm:["We sincerely thank the reviewer for this constructive suggestion. The literature review has been carefully updated to reflect recent developments in the field and to provide a more current foundation for the study."],concise:["We thank the reviewer for this suggestion. The literature review has been updated with recent and relevant studies."]},
 hypothesis:{balanced:["We appreciate the reviewer’s insightful comment regarding the theoretical development of the hypotheses. In response, the rationale underlying the proposed relationships has been strengthened and elaborated to provide a more theory-driven justification.","We thank the reviewer for pointing out that the hypothesis development required stronger theoretical grounding. Accordingly, the relevant arguments have been expanded and supported with clearer theoretical reasoning."],warm:["We sincerely appreciate this insightful comment, which has helped us strengthen the logic underlying the proposed hypotheses. The hypothesis development section has therefore been revised to provide a more explicit and theoretically grounded rationale."],concise:["We thank the reviewer for this comment. The theoretical rationale for the hypotheses has been strengthened and elaborated."]},
 methodology:{balanced:["We thank the reviewer for pointing out the need for greater methodological transparency. Accordingly, additional information has been incorporated into the methodology section to clarify the research design and implementation.","We appreciate the reviewer’s request for further methodological detail. In response, the methodology section has been expanded to provide a more transparent account of the procedures followed in the study."],warm:["We sincerely appreciate the reviewer’s constructive methodological comment. The methodology section has been expanded to provide greater transparency concerning the procedures and decisions underlying the study."],concise:["We thank the reviewer for this methodological comment. Additional procedural details have been added to the methodology section."]},
 sampling:{balanced:["We thank the reviewer for highlighting the need for additional information on the sampling and data collection procedures. In response, the methodology section has been expanded to clarify the sampling approach, data collection process, and characteristics of the final sample."],warm:["We sincerely appreciate the reviewer’s request for greater clarity regarding the sample and data collection process. These details have now been reported more comprehensively in the revised methodology section."],concise:["We thank the reviewer for this comment. The sampling procedure, data collection process, and sample characteristics have been clarified."]},
 analytics:{balanced:["We appreciate the reviewer’s request for further clarification regarding the analytical approach employed in the study. In response, the rationale for selecting the analytical method has been explained in greater detail and its suitability for the research model has been clarified."],warm:["We sincerely thank the reviewer for raising this important methodological point. The revised manuscript now provides a clearer justification for the selected analytical approach and its appropriateness for the research objectives."],concise:["We thank the reviewer for this comment. The choice of analytical method and its suitability for the research model have been clarified."]},
 validity:{balanced:["We thank the reviewer for emphasizing the importance of reporting the relevant validity and reliability assessments. Accordingly, the revised manuscript now presents these evaluations more explicitly and systematically."],warm:["We sincerely appreciate this important methodological observation. The validity and reliability assessments have been reported more comprehensively in the revised manuscript."],concise:["We thank the reviewer for this comment. The relevant validity and reliability assessments have been added and clarified."]},
 discussion:{balanced:["We thank the reviewer for this constructive suggestion concerning the organization and clarity of the discussion section. Accordingly, the discussion has been reorganized to more clearly distinguish the study’s theoretical contributions, managerial implications, limitations, and directions for future research."],warm:["We sincerely appreciate the reviewer’s helpful suggestion regarding the discussion section. The section has been carefully restructured to present the study’s contributions, implications, limitations, and future research directions more clearly."],concise:["We thank the reviewer for this suggestion. The discussion section has been reorganized to separate contributions, implications, limitations, and future research directions."]},
 positive:{balanced:["We sincerely thank the reviewer for this positive assessment of our manuscript and for recognizing its potential contribution to the literature.","We greatly appreciate the reviewer’s encouraging evaluation of the manuscript and the constructive guidance provided for its further improvement."],warm:["We are grateful to the reviewer for this encouraging assessment and for recognizing the relevance and potential contribution of our study."],concise:["We thank the reviewer for this positive assessment of the manuscript."]},
 clarity:{balanced:["We thank the reviewer for highlighting the need for greater clarity. In response, the relevant parts of the manuscript have been revised to improve the precision and transparency of the presentation."],warm:["We sincerely appreciate this helpful observation. The relevant sections have been carefully revised to improve clarity and readability."],concise:["We thank the reviewer for this comment. The relevant section has been revised for greater clarity."]},
 general:{balanced:["We thank the reviewer for this valuable and constructive comment. In response, the relevant section of the manuscript has been carefully revised to address the concern raised.","We appreciate the reviewer’s thoughtful suggestion. The manuscript has been revised accordingly, and the relevant changes have been incorporated into the revised version."],warm:["We sincerely appreciate the reviewer’s thoughtful and constructive comment. This suggestion has been carefully considered and addressed in the revised manuscript."],concise:["We thank the reviewer for this comment. The manuscript has been revised accordingly."]}
};
function classify(text){const t=text.toLowerCase();const checks=[["positive",["timely","relevant topic","potential contribution","useful contribution","well-written","interesting manuscript"]],["theoretical",["theoretical contribution","theoretical contributions","theoretical framework","extends existing","extend existing","theoretical value"]],["literature",["literature review","recent studies","update the literature","prior literature","references","2023","2024","2025","2026"]],["hypothesis",["hypotheses","hypothesis","theoretical reasoning","rationale","proposed relationship"]],["sampling",["sampling","sample characteristics","data collection","respondents","participants","sample size"]],["analytics",["analytical method","analysis method","analytical approach","pls-sem","cb-sem","sem","regression","why the selected"]],["validity",["validity","reliability","cronbach","htmt","ave","composite reliability"]],["discussion",["discussion section","managerial implications","theoretical implications","limitations","future research"]],["methodology",["methodology","method section","research design","measurement scales","measures"]],["clarity",["clarity","unclear","not sufficiently clear","clarify","more clearly"]]];for(const [cat,kws] of checks){if(kws.some(k=>t.includes(k)))return cat}return"general"}
function pick(arr,seed){let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;return arr[h%arr.length]}
function parseComments(raw,prefix){raw=raw.trim();if(!raw)return[];const lines=raw.split(/\r?\n/),items=[];let current=null;const rx=/^\s*((?:R|Reviewer\s*)?\d+(?:\.\d+)+)\s*[:.]?\s*$/i,rxInline=/^\s*((?:R|Reviewer\s*)?\d+(?:\.\d+)+)\s*[:.-]\s*(.+)$/i;for(const line of lines){let m=line.match(rxInline);if(m){if(current)items.push(current);current={id:m[1].replace(/^Reviewer\s*/i,"R"),text:m[2].trim()};continue}m=line.match(rx);if(m){if(current)items.push(current);current={id:m[1].replace(/^Reviewer\s*/i,"R"),text:""};continue}if(current){if(line.trim())current.text+=(current.text?" ":"")+line.trim()}else if(line.trim()){const parts=raw.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);return parts.map((p,i)=>({id:`${prefix}.${i+1}`,text:p.replace(/\s+/g," ")}))}}if(current)items.push(current);if(items.length===0)return raw.split(/\n\s*\n/).map((p,i)=>({id:`${prefix}.${i+1}`,text:p.trim().replace(/\s+/g," ")}));return items.filter(x=>x.text)}
function generate(){const raw=document.getElementById("comments").value,prefix=document.getElementById("reviewer").value.trim()||"R1",tone=document.getElementById("tone").value,items=parseComments(raw,prefix),root=document.getElementById("results");if(!items.length){root.className="empty";root.textContent="Lütfen en az bir hakem yorumu girin.";return}root.className="";root.innerHTML="";items.forEach((it,idx)=>{const cat=classify(it.text),starter=pick(templates[cat][tone],it.text),n=(it.id.match(/(\d+)$/)||[null,idx+1])[1],wrap=document.createElement("div");wrap.className="result";wrap.innerHTML=`<div class="rhead"><div class="rtitle">${escapeHtml(it.id)} <span class="pill">${cat}</span></div><button class="ghost" onclick="copyOne(${idx})">Kopyala</button></div><div class="comment">${escapeHtml(it.text)}</div><label>Response ${escapeHtml(n)} başlangıcı</label><textarea class="starter" id="starter-${idx}">${escapeHtml(starter)}</textarea>`;root.appendChild(wrap)});window.currentItems=items}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function copyOne(i){navigator.clipboard.writeText(document.getElementById(`starter-${i}`).value)}
function copyAll(){if(!window.currentItems)return;const out=window.currentItems.map((it,i)=>{const n=(it.id.match(/(\d+)$/)||[null,i+1])[1];return`${it.id}\n${it.text}\n\nResponse ${n}:\n${document.getElementById(`starter-${i}`).value}`}).join("\n\n");navigator.clipboard.writeText(out)}
function downloadTxt(){if(!window.currentItems)return;const out=window.currentItems.map((it,i)=>{const n=(it.id.match(/(\d+)$/)||[null,i+1])[1];return`${it.id}\n${it.text}\n\nResponse ${n}:\n${document.getElementById(`starter-${i}`).value}`}).join("\n\n");const blob=new Blob([out],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="reviewer_responses.txt";a.click();URL.revokeObjectURL(a.href)}
function clearAll(){document.getElementById("comments").value="";document.getElementById("results").className="empty";document.getElementById("results").textContent="Henüz bir çıktı oluşturulmadı.";window.currentItems=null}
function loadExample(){document.getElementById("comments").value=`R1.1\nThe manuscript addresses a timely and relevant topic and has the potential to make a useful contribution to the literature.\n\nR1.2\nThe theoretical contribution is not sufficiently clear. The authors should explain more explicitly how the proposed model extends existing studies rather than merely applying established constructs in a new context.\n\nR1.3\nThe literature review should be updated to include recent studies published between 2023 and 2026, particularly research focusing on artificial intelligence, consumer trust, and technology adoption.\n\nR1.4\nThe rationale for the proposed hypotheses needs to be strengthened.\n\nR1.5\nThe methodology section should provide additional information about the sampling procedure, data collection process, measurement scales, and sample characteristics.\n\nR1.6\nThe authors should explain why the selected analytical method is appropriate for the research model and provide the relevant validity and reliability assessments.\n\nR1.7\nThe discussion section should be revised to distinguish more clearly between theoretical contributions, managerial implications, limitations, and directions for future research.`;generate()}
</script>
</body>
</html>
